<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi pencucian evaporator AC</title>
  <desc id="desc">Potongan melintang unit AC indoor yang menunjukkan filter, evaporator, kipas, dan talang air.</desc>
  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.5" fill="#101B17" opacity="0.10"/>
      <circle cx="5.5" cy="6" r="0.4" fill="#101B17" opacity="0.07"/>
    </pattern>
    <pattern id="fins" width="16" height="100" patternUnits="userSpaceOnUse">
      <rect width="16" height="100" fill="#DCE7E2"/>
      <path d="M8 0 V100" stroke="#0B5D4F" stroke-width="2.5"/>
      <path d="M8 0 V100" stroke="#FBFAF6" stroke-width="0.8" opacity="0.55" transform="translate(2 0)"/>
    </pattern>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0 L10 10 M10 0 L0 10" stroke="#5B625D" stroke-width="1" opacity="0.5"/>
    </pattern>
    <clipPath id="unit"><rect x="78" y="330" width="644" height="290" rx="18"/></clipPath>
  </defs>

  <rect width="800" height="1200" fill="#F4F1EA"/>
  <rect width="800" height="1200" fill="url(#grain)"/>

  <!-- wall tiles -->
  <g stroke="#CFC7B8" stroke-width="1" opacity="0.7">
    <path d="M0 130 H800 M0 470 H800 M0 810 H800 M0 1150 H800"/>
    <path d="M130 0 V1200 M470 0 V1200"/>
  </g>

  <!-- annotation top -->
  <g font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#5B625D">
    <text x="78" y="108">EVAPORATOR / POTONGAN</text>
    <text x="722" y="108" text-anchor="end">GCC — SERVIS AC</text>
  </g>
  <line x1="78" y1="128" x2="722" y2="128" stroke="#101B17" stroke-width="2"/>

  <!-- unit shell, exploded -->
  <g>
    <rect x="78" y="330" width="644" height="290" rx="18" fill="#FBFAF6" stroke="#101B17" stroke-width="4"/>
    <rect x="98" y="350" width="604" height="250" rx="10" fill="#EAE6DD" stroke="#CFC7B8" stroke-width="2"/>

    <!-- airflow -->
    <g stroke="#0B5D4F" stroke-width="2" opacity="0.5" fill="none">
      <path d="M120 300 C180 260 260 260 320 300"/>
      <path d="M120 282 C190 232 280 232 350 282"/>
      <path d="M120 264 C200 204 300 204 380 264"/>
    </g>

    <!-- filter mesh top -->
    <rect x="120" y="365" width="560" height="34" fill="#FBFAF6" stroke="#5B625D" stroke-width="2"/>
    <rect x="124" y="369" width="552" height="26" fill="url(#mesh)"/>

    <!-- coil -->
    <rect x="120" y="412" width="560" height="86" fill="url(#fins)" stroke="#0B5D4F" stroke-width="3"/>
    <path d="M120 442 H680" stroke="#0B5D4F" stroke-width="2" opacity="0.55"/>

    <!-- water drops on coil -->
    <g fill="#0B5D4F" opacity="0.85">
      <path d="M210 470 q6 12 0 18 q-6 -6 0 -18"/>
      <path d="M262 460 q5 10 0 15 q-5 -5 0 -15"/>
      <path d="M330 474 q6 12 0 18 q-6 -6 0 -18"/>
      <path d="M402 462 q5 10 0 15 q-5 -5 0 -15"/>
      <path d="M470 476 q6 12 0 18 q-6 -6 0 -18"/>
      <path d="M542 464 q5 10 0 15 q-5 -5 0 -15"/>
      <path d="M606 474 q6 12 0 18 q-6 -6 0 -18"/>
    </g>

    <!-- blower -->
    <circle cx="250" cy="560" r="42" fill="#FBFAF6" stroke="#101B17" stroke-width="3"/>
    <g stroke="#5B625D" stroke-width="3">
      <path d="M250 524 V596 M214 560 H286 M225 535 L275 585 M275 535 L225 585"/>
    </g>
    <circle cx="250" cy="560" r="9" fill="#101B17"/>

    <!-- drain tray -->
    <path d="M120 604 H560 L540 632 H140 Z" fill="#DCE7E2" stroke="#0B5D4F" stroke-width="3"/>
    <path d="M560 618 H700" stroke="#0B5D4F" stroke-width="8" stroke-linecap="round"/>
    <path d="M690 618 q16 0 16 18 v44" fill="none" stroke="#0B5D4F" stroke-width="8" stroke-linecap="round"/>

    <!-- louver -->
    <path d="M430 604 L680 604 L700 660 L450 660 Z" fill="#FBFAF6" stroke="#101B17" stroke-width="3"/>
    <path d="M444 622 H684 M450 640 H690" stroke="#CFC7B8" stroke-width="3"/>
  </g>

  <!-- callouts -->
  <g font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.6" fill="#5B625D">
    <path d="M680 394 L752 394 L752 300" fill="none" stroke="#5B625D" stroke-width="1"/>
    <text x="612" y="246" text-anchor="end">SARINGAN</text>

    <path d="M680 455 L744 455" fill="none" stroke="#5B625D" stroke-width="1"/>
    <text x="752" y="459">SIRIP EVAPORATOR</text>

    <path d="M292 560 L352 560" fill="none" stroke="#5B625D" stroke-width="1"/>
    <text x="360" y="564">BLOWER</text>

    <path d="M706 665 L744 700" fill="none" stroke="#5B625D" stroke-width="1"/>
    <text x="750" y="716">TALANG</text>
  </g>

  <!-- bucket / water -->
  <g>
    <path d="M470 760 L700 760 L732 940 L438 940 Z" fill="#0E1F1A"/>
    <path d="M486 790 L684 790 L708 914 L462 914 Z" fill="#0B5D4F"/>
    <path d="M486 790 L684 790 L692 836 L478 836 Z" fill="#DCE7E2" opacity="0.35"/>
    <g stroke="#DCE7E2" stroke-width="2" opacity="0.65" fill="none">
      <path d="M500 860 q30 -10 60 0 t60 0 t60 0"/>
      <path d="M488 884 q34 -12 68 0 t68 0 t68 0"/>
    </g>
    <path d="M626 760 q0 -52 -24 -74" fill="none" stroke="#0B5D4F" stroke-width="3" stroke-dasharray="4 8"/>
  </g>

  <!-- brush + sprayer on the ground -->
  <g>
    <rect x="90" y="930" width="270" height="26" rx="13" fill="#A9741C" stroke="#101B17" stroke-width="3"/>
    <g stroke="#101B17" stroke-width="3">
      <path d="M110 956 v30 M140 956 v34 M170 956 v30 M200 956 v34 M230 956 v30 M260 956 v34 M290 956 v30 M320 956 v34"/>
    </g>
    <rect x="96" y="912" width="258" height="20" rx="10" fill="#9B4A2B"/>

    <g transform="translate(548 1010) rotate(-8)">
      <rect x="0" y="0" width="188" height="58" rx="10" fill="#FBFAF6" stroke="#101B17" stroke-width="3"/>
      <rect x="24" y="12" width="120" height="34" rx="4" fill="#DCE7E2" stroke="#0B5D4F" stroke-width="2"/>
      <path d="M120 28 h56" stroke="#101B17" stroke-width="5" stroke-linecap="round"/>
      <path d="M146 10 v36" stroke="#9B4A2B" stroke-width="7"/>
      <path d="M0 46 l-34 22 M12 58 l-18 30" stroke="#0B5D4F" stroke-width="3"/>
    </g>
  </g>

  <!-- footer -->
  <line x1="78" y1="1130" x2="722" y2="1130" stroke="#CFC7B8" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.2" fill="#5B625D">
    <text x="78" y="1162">PLAT TEKNIS / 02</text>
    <text x="722" y="1162" text-anchor="end">CUCI AC — 60 MENIT</text>
  </g>
</svg>
