<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi manifold gauge</title>
  <desc id="desc">Ilustrasi teknis dua dial manifold gauge dengan selang tekanan pada permukaan kayu.</desc>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.55" fill="#101B17" opacity="0.12"/>
      <circle cx="4.5" cy="5" r="0.4" fill="#101B17" opacity="0.08"/>
    </pattern>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset="1" stop-color="#E4DFD3"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A25C"/>
      <stop offset="0.55" stop-color="#A9741C"/>
      <stop offset="1" stop-color="#7C5313"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect width="900" height="1200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="900" height="1200" fill="#EAE6DD"/>
    <rect width="900" height="1200" fill="url(#grain)"/>

    <!-- work surface -->
    <path d="M0 760 L900 690 L900 1200 L0 1200 Z" fill="#E1DBCB"/>
    <path d="M0 760 L900 690" stroke="#CFC7B8" stroke-width="2"/>
    <path d="M0 820 L900 750" stroke="#CFC7B8" stroke-width="1" opacity="0.6"/>
    <path d="M120 1200 L300 760" stroke="#CFC7B8" stroke-width="1" opacity="0.45"/>
    <path d="M540 1200 L600 725" stroke="#CFC7B8" stroke-width="1" opacity="0.45"/>

    <!-- body plate -->
    <rect x="300" y="388" width="300" height="390" rx="6" fill="#101B17"/>
    <rect x="314" y="402" width="272" height="362" rx="3" fill="#0E1F1A" stroke="#2A3A34" stroke-width="2"/>

    <!-- hoses behind -->
    <path d="M250 800 C215 900 275 985 360 1005 C455 1028 520 985 548 910" fill="none" stroke="#0B5D4F" stroke-width="26" stroke-linecap="round"/>
    <path d="M250 800 C215 900 275 985 360 1005 C455 1028 520 985 548 910" fill="none" stroke="#DCE7E2" stroke-width="4" stroke-linecap="round" opacity="0.35" stroke-dasharray="2 26"/>
    <path d="M650 800 C690 900 630 990 548 1015 C470 1038 405 1005 372 940" fill="none" stroke="#9B4A2B" stroke-width="26" stroke-linecap="round"/>
    <path d="M650 800 C690 900 630 990 548 1015 C470 1038 405 1005 372 940" fill="none" stroke="#F4F1EA" stroke-width="4" stroke-linecap="round" opacity="0.3" stroke-dasharray="2 26"/>
    <path d="M448 830 L448 1080" stroke="#A9741C" stroke-width="24" stroke-linecap="round"/>
    <circle cx="448" cy="1086" r="13" fill="#101B17"/>

    <!-- hose fittings -->
    <rect x="226" y="766" width="66" height="48" rx="5" fill="url(#brass)" stroke="#5B3B0D" stroke-width="2"/>
    <rect x="238" y="774" width="42" height="14" rx="2" fill="#E0C48E" opacity="0.6"/>
    <rect x="616" y="766" width="66" height="48" rx="5" fill="url(#brass)" stroke="#5B3B0D" stroke-width="2"/>
    <rect x="628" y="774" width="42" height="14" rx="2" fill="#E0C48E" opacity="0.6"/>

    <!-- dials -->
    <g>
      <circle cx="390" cy="545" r="112" fill="#101B17"/>
      <circle cx="390" cy="545" r="100" fill="url(#dial)" stroke="#CFC7B8" stroke-width="2"/>
      <circle cx="390" cy="545" r="84" fill="none" stroke="#101B17" stroke-width="1" opacity="0.25"/>
      <g stroke="#101B17" stroke-width="2.4">
        <line x1="390" y1="455" x2="390" y2="470"/>
        <line x1="390" y1="620" x2="390" y2="635"/>
        <line x1="300" y1="545" x2="315" y2="545"/>
        <line x1="465" y1="545" x2="480" y2="545"/>
        <line x1="326" y1="481" x2="337" y2="492"/>
        <line x1="443" y1="598" x2="454" y2="609"/>
        <line x1="454" y1="481" x2="443" y2="492"/>
        <line x1="337" y1="598" x2="326" y2="609"/>
      </g>
      <g stroke="#5B625D" stroke-width="1">
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(15 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(30 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(60 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(75 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(105 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(120 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(150 390 545)"/>
        <line x1="390" y1="461" x2="390" y2="470" transform="rotate(165 390 545)"/>
      </g>
      <text x="390" y="505" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#5B625D">LOW</text>
      <text x="390" y="592" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#5B625D">HIGH</text>
      <text x="390" y="576" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#101B17">62</text>
      <text x="390" y="594" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1" fill="#5B625D">PSI</text>
      <line x1="390" y1="545" x2="352" y2="492" stroke="#9B4A2B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="390" cy="545" r="7" fill="#101B17" stroke="#A9741C" stroke-width="2"/>
    </g>

    <g>
      <circle cx="610" cy="545" r="112" fill="#101B17"/>
      <circle cx="610" cy="545" r="100" fill="url(#dial)" stroke="#CFC7B8" stroke-width="2"/>
      <circle cx="610" cy="545" r="84" fill="none" stroke="#101B17" stroke-width="1" opacity="0.25"/>
      <g stroke="#101B17" stroke-width="2.4">
        <line x1="610" y1="455" x2="610" y2="470"/>
        <line x1="610" y1="620" x2="610" y2="635"/>
        <line x1="520" y1="545" x2="535" y2="545"/>
        <line x1="685" y1="545" x2="700" y2="545"/>
        <line x1="546" y1="481" x2="557" y2="492"/>
        <line x1="663" y1="598" x2="674" y2="609"/>
        <line x1="674" y1="481" x2="663" y2="492"/>
        <line x1="557" y1="598" x2="546" y2="609"/>
      </g>
      <text x="610" y="505" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#5B625D">VAC</text>
      <text x="610" y="592" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#5B625D">PRESS</text>
      <text x="610" y="576" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#101B17">0</text>
      <text x="610" y="594" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1" fill="#5B625D">BAR</text>
      <line x1="610" y1="545" x2="646" y2="500" stroke="#0B5D4F" stroke-width="3" stroke-linecap="round"/>
      <circle cx="610" cy="545" r="7" fill="#101B17" stroke="#A9741C" stroke-width="2"/>
    </g>

    <!-- knobs -->
    <circle cx="330" cy="752" r="24" fill="#9B4A2B" stroke="#101B17" stroke-width="3"/>
    <circle cx="330" cy="752" r="8" fill="#101B17"/>
    <circle cx="450" cy="752" r="24" fill="#0B5D4F" stroke="#101B17" stroke-width="3"/>
    <circle cx="450" cy="752" r="8" fill="#101B17"/>
    <circle cx="570" cy="752" r="24" fill="#A9741C" stroke="#101B17" stroke-width="3"/>
    <circle cx="570" cy="752" r="8" fill="#101B17"/>

    <!-- hook -->
    <path d="M448 388 L448 330 C448 300 410 296 398 320" fill="none" stroke="#101B17" stroke-width="14" stroke-linecap="round"/>

    <!-- annotations -->
    <g font-family="ui-monospace, monospace" fill="#5B625D" font-size="13" letter-spacing="1.5">
      <path d="M710 545 L790 545" stroke="#5B625D" stroke-width="1"/>
      <text x="796" y="549">TEKANAN KERJA</text>
      <path d="M300 752 L196 790" stroke="#5B625D" stroke-width="1"/>
      <text x="120" y="812">KATUP</text>
      <path d="M448 330 L560 268" stroke="#5B625D" stroke-width="1"/>
      <text x="566" y="264">GANTA</text>
    </g>

    <!-- footer plate -->
    <g font-family="ui-monospace, monospace" fill="#5B625D" font-size="14" letter-spacing="3">
      <line x1="60" y1="1108" x2="840" y2="1108" stroke="#CFC7B8" stroke-width="1"/>
      <text x="60" y="1142">PLAT TEKNIS / 01</text>
      <text x="840" y="1142" text-anchor="end">GCC — SERVIS AC</text>
    </g>
  </g>
</svg>
