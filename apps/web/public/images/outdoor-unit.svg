<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi unit outdoor AC di dinding rumah</title>
  <desc id="desc">Ilustrasi unit kondensor outdoor terpasang pada braket dinding, dengan pipa rapi dan tanaman di bawahnya.</desc>
  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.5" fill="#101B17" opacity="0.08"/>
      <circle cx="5.5" cy="6" r="0.4" fill="#101B17" opacity="0.06"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE7E2"/>
      <stop offset="1" stop-color="#EAE6DD"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/>
      <stop offset="1" stop-color="#E4DFD3"/>
    </linearGradient>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0 H18" stroke="#2A3A34" stroke-width="2"/>
    </pattern>
    <clipPath id="cond"><rect x="690" y="300" width="420" height="290" rx="10"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <!-- distant rooftops -->
  <g opacity="0.5">
    <path d="M0 470 L150 400 L300 470 V560 H0 Z" fill="#CFC7B8"/>
    <path d="M260 480 L400 420 L540 480 V560 H260 Z" fill="#C4BCAA"/>
    <path d="M1040 468 L1190 396 L1340 468 V560 H1040 Z" fill="#CFC7B8"/>
    <path d="M1300 480 L1440 420 L1600 480 V560 H1300 Z" fill="#C4BCAA"/>
  </g>

  <!-- wall plane -->
  <rect x="0" y="420" width="1600" height="480" fill="url(#wall)"/>
  <g stroke="#CFC7B8" stroke-width="1.5" opacity="0.75">
    <path d="M0 520 H1600 M0 620 H1600 M0 720 H1600 M0 820 H1600"/>
    <path d="M160 420 V900 M420 420 V900 M1000 420 V900 M1260 420 V900"/>
  </g>

  <!-- wall texture patches -->
  <g fill="#101B17" opacity="0.035">
    <rect x="80" y="560" width="240" height="90"/>
    <rect x="1180" y="640" width="300" height="120"/>
  </g>

  <!-- cable + pipe to indoor unit -->
  <path d="M1110 430 V250 H1450" fill="none" stroke="#FBFAF6" stroke-width="16" stroke-linecap="round"/>
  <path d="M1110 430 V250 H1450" fill="none" stroke="#101B17" stroke-width="2" opacity="0.35"/>
  <path d="M1096 430 V262 H1450" fill="none" stroke="#0E1F1A" stroke-width="12" stroke-linecap="round"/>
  <path d="M1096 430 V262 H1450" fill="none" stroke="#5B625D" stroke-width="2" opacity="0.6" stroke-dasharray="1 14"/>
  <g fill="#101B17">
    <rect x="1086" y="278" width="20" height="26" rx="4"/>
    <rect x="1086" y="330" width="20" height="26" rx="4"/>
    <rect x="1330" y="254" width="26" height="20" rx="4"/>
  </g>

  <!-- condensate drip -->
  <path d="M700 600 V650" stroke="#0B5D4F" stroke-width="6" stroke-linecap="round"/>
  <path d="M700 668 q8 14 0 22 q-8 -8 0 -22" fill="#0B5D4F"/>

  <!-- brackets -->
  <g fill="#101B17">
    <path d="M640 600 H740 L700 640 Z"/>
    <path d="M1110 600 H1210 L1150 640 Z"/>
    <rect x="634" y="590" width="110" height="16" rx="3"/>
    <rect x="1106" y="590" width="110" height="16" rx="3"/>
  </g>
  <g stroke="#101B17" stroke-width="5">
    <path d="M660 640 L720 600 M1160 640 L1220 600"/>
  </g>

  <!-- condenser unit -->
  <rect x="690" y="300" width="420" height="290" rx="10" fill="#FBFAF6" stroke="#101B17" stroke-width="5"/>
  <rect x="708" y="318" width="384" height="254" rx="6" fill="#EAE6DD" stroke="#CFC7B8" stroke-width="2"/>

  <g clip-path="url(#cond)">
    <circle cx="902" cy="440" r="118" fill="#0E1F1A"/>
    <circle cx="902" cy="440" r="112" fill="url(#grille)"/>
    <circle cx="902" cy="440" r="96" fill="none" stroke="#5B625D" stroke-width="2"/>
    <g stroke="#5B625D" stroke-width="3" opacity="0.85">
      <path d="M902 344 V536 M806 440 H998 M834 372 L970 508 M970 372 L834 508"/>
    </g>
    <circle cx="902" cy="440" r="16" fill="#A9741C" stroke="#101B17" stroke-width="3"/>
    <circle cx="902" cy="440" r="5" fill="#101B17"/>
  </g>

  <!-- unit vents -->
  <g stroke="#101B17" stroke-width="2" opacity="0.55">
    <path d="M720 330 V330"/>
  </g>
  <g fill="#101B17">
    <rect x="722" y="330" width="70" height="8" rx="4"/>
    <rect x="722" y="348" width="70" height="8" rx="4"/>
    <rect x="722" y="366" width="70" height="8" rx="4"/>
  </g>

  <!-- brand plate -->
  <g font-family="ui-monospace, monospace">
    <rect x="1064" y="532" width="86" height="24" rx="3" fill="#101B17"/>
    <text x="1107" y="548" text-anchor="middle" font-size="12" letter-spacing="2" fill="#F4F1EA">GCC</text>
  </g>

  <!-- plants -->
  <g>
    <path d="M180 900 V700" stroke="#0B5D4F" stroke-width="5"/>
    <g fill="#0B5D4F">
      <path d="M180 720 C140 690 118 640 128 604 C170 620 190 666 180 720 Z"/>
      <path d="M180 760 C222 730 246 684 236 646 C194 662 174 708 180 760 Z"/>
      <path d="M180 800 C138 780 110 742 112 708 C154 718 176 754 180 800 Z"/>
      <path d="M180 840 C224 818 250 780 248 748 C206 758 184 794 180 840 Z"/>
    </g>
    <path d="M150 900 H214 L204 842 H160 Z" fill="#9B4A2B" stroke="#101B17" stroke-width="3"/>

    <path d="M1360 900 V760" stroke="#0B5D4F" stroke-width="5"/>
    <g fill="#0B5D4F">
      <path d="M1360 780 C1326 758 1310 720 1318 692 C1352 704 1368 740 1360 780 Z"/>
      <path d="M1360 814 C1394 792 1410 754 1402 726 C1368 738 1352 774 1360 814 Z"/>
      <path d="M1360 850 C1328 836 1306 808 1308 782 C1342 790 1358 818 1360 850 Z"/>
    </g>
    <path d="M1336 900 H1388 L1380 858 H1344 Z" fill="#A9741C" stroke="#101B17" stroke-width="3"/>
  </g>

  <!-- ladder at right edge -->
  <g stroke="#101B17" stroke-width="5" opacity="0.9">
    <path d="M1508 900 V520 M1564 900 V520"/>
  </g>
  <g stroke="#101B17" stroke-width="3">
    <path d="M1508 560 H1564 M1508 610 H1564 M1508 660 H1564 M1508 710 H1564 M1508 760 H1564 M1508 810 H1564 M1508 860 H1564"/>
  </g>

  <!-- ground shadow -->
  <path d="M620 900 C720 860 1180 860 1300 900 Z" fill="#101B17" opacity="0.12"/>

  <!-- caption rail -->
  <g font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#5B625D">
    <text x="70" y="80">PEMASANGAN LUAR / 03</text>
    <text x="1530" y="80" text-anchor="end">GCC — SERVIS AC</text>
  </g>
  <line x1="70" y1="100" x2="1530" y2="100" stroke="#101B17" stroke-width="2" opacity="0.35"/>
</svg>
