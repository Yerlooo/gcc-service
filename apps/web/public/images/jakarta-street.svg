<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi kawasan hunian Jakarta</title>
  <desc id="desc">Ilustrasi jalan lingkungan dengan deretan rumah, pagar, pohon, dan kabel listrik pada sore hari.</desc>
  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.5" fill="#101B17" opacity="0.08"/>
      <circle cx="5.5" cy="6" r="0.4" fill="#101B17" opacity="0.06"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE7E2"/>
      <stop offset="0.6" stop-color="#EDE6D6"/>
      <stop offset="1" stop-color="#E3C9A4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B625D"/>
      <stop offset="1" stop-color="#3B423E"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101B17" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#101B17" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
  <rect width="1600" height="1200" fill="url(#grain)"/>

  <!-- sun -->
  <circle cx="1230" cy="300" r="92" fill="#E3C9A4" opacity="0.55"/>
  <circle cx="1230" cy="300" r="62" fill="#A9741C" opacity="0.18"/>

  <!-- far skyline -->
  <g fill="#CFC7B8" opacity="0.75">
    <rect x="0" y="430" width="130" height="210"/>
    <rect x="150" y="390" width="160" height="250"/>
    <rect x="330" y="450" width="120" height="190"/>
    <rect x="1130" y="420" width="150" height="220"/>
    <rect x="1300" y="380" width="180" height="260"/>
    <rect x="1500" y="440" width="100" height="200"/>
    <path d="M1080 640 V480 L1150 440 L1220 480 V640 Z"/>
  </g>
  <g fill="#DCD5C5">
    <rect x="470" y="470" width="140" height="170"/>
    <rect x="640" y="430" width="110" height="210"/>
    <rect x="790" y="480" width="170" height="160"/>
    <rect x="990" y="440" width="100" height="200"/>
  </g>

  <!-- trees behind -->
  <g fill="#0B5D4F" opacity="0.55">
    <circle cx="210" cy="520" r="70"/>
    <circle cx="270" cy="545" r="52"/>
    <circle cx="1390" cy="520" r="80"/>
    <circle cx="1320" cy="550" r="58"/>
  </g>
  <g stroke="#5B3B0D" stroke-width="8" opacity="0.5">
    <path d="M232 590 V650 M1370 600 V660"/>
  </g>

  <!-- house row left -->
  <g>
    <!-- house 1 -->
    <path d="M40 760 V600 L200 520 L360 600 V760 Z" fill="#FBFAF6" stroke="#101B17" stroke-width="4"/>
    <path d="M20 604 L200 508 L380 604 L360 626 L200 544 L40 626 Z" fill="#9B4A2B" stroke="#101B17" stroke-width="4"/>
    <rect x="90" y="630" width="80" height="70" fill="#0B5D4F"/>
    <path d="M130 630 V700 M90 665 H170" stroke="#F4F1EA" stroke-width="3"/>
    <rect x="230" y="630" width="70" height="130" fill="#101B17"/>
    <circle cx="244" cy="700" r="3.5" fill="#A9741C"/>
    <path d="M60 760 V730 H100 V760" fill="#9B4A2B"/>
    <path d="M270 760 V724 H300 V760" fill="#9B4A2B"/>

    <!-- fence 1 -->
    <g stroke="#5B625D" stroke-width="4">
      <path d="M360 760 V690 M392 760 V690 M424 760 V690 M456 760 V690 M488 760 V690 M520 760 V690 M552 760 V690"/>
      <path d="M356 706 H560 M356 742 H560"/>
    </g>
    <rect x="360" y="690" width="200" height="70" fill="#DCE7E2" opacity="0.35"/>
  </g>

  <!-- house row right -->
  <g>
    <path d="M1080 760 V610 L1240 530 L1400 610 V760 Z" fill="#EAE6DD" stroke="#101B17" stroke-width="4"/>
    <path d="M1060 614 L1240 518 L1420 614 L1400 636 L1240 554 L1080 636 Z" fill="#0B5D4F" stroke="#101B17" stroke-width="4"/>
    <rect x="1140" y="640" width="78" height="70" fill="#A9741C"/>
    <path d="M1179 640 V710 M1140 675 H1218" stroke="#FBFAF6" stroke-width="3"/>
    <rect x="1268" y="640" width="72" height="120" fill="#101B17"/>
    <circle cx="1282" cy="704" r="3.5" fill="#A9741C"/>
    <path d="M1100 760 V730 H1140 V760" fill="#9B4A2B"/>
    <path d="M1310 760 V726 H1344 V760" fill="#9B4A2B"/>

    <!-- fence 2 -->
    <g stroke="#5B625D" stroke-width="4">
      <path d="M920 760 V692 M952 760 V692 M984 760 V692 M1016 760 V692 M1048 760 V692"/>
      <path d="M916 710 H1052 M916 744 H1052"/>
    </g>
    <rect x="916" y="692" width="136" height="68" fill="#DCE7E2" opacity="0.35"/>
  </g>

  <!-- middle house, set back -->
  <g>
    <path d="M600 760 V640 L740 570 L880 640 V760 Z" fill="#F4F1EA" stroke="#101B17" stroke-width="4"/>
    <path d="M584 644 L740 560 L896 644 L880 664 L740 588 L600 664 Z" fill="#A9741C" stroke="#101B17" stroke-width="4"/>
    <rect x="650" y="662" width="56" height="50" fill="#0B5D4F"/>
    <rect x="760" y="662" width="52" height="98" fill="#101B17"/>
    <path d="M700 760 V712 H734 V760" fill="#9B4A2B"/>
    <path d="M620 760 V700 H646 V760" fill="#5B625D" opacity="0.5"/>
  </g>

  <!-- power poles + cables -->
  <g>
    <path d="M480 800 V330" stroke="#5B625D" stroke-width="14"/>
    <path d="M430 410 H530" stroke="#5B625D" stroke-width="10"/>
    <path d="M440 470 H520" stroke="#5B625D" stroke-width="8"/>
    <g fill="#101B17">
      <rect x="428" y="398" width="12" height="24"/>
      <rect x="520" y="398" width="12" height="24"/>
      <rect x="440" y="460" width="10" height="20"/>
      <rect x="510" y="460" width="10" height="20"/>
    </g>

    <path d="M60 360 C260 330 400 350 480 406" fill="none" stroke="#101B17" stroke-width="3"/>
    <path d="M60 392 C270 366 400 382 480 430" fill="none" stroke="#101B17" stroke-width="3"/>
    <path d="M480 406 C700 380 880 396 1100 360 C1280 332 1400 350 1560 380" fill="none" stroke="#101B17" stroke-width="3"/>
    <path d="M480 430 C710 410 900 424 1120 392 C1300 366 1430 382 1560 408" fill="none" stroke="#101B17" stroke-width="3"/>
    <path d="M480 470 C700 470 860 492 1010 520" fill="none" stroke="#101B17" stroke-width="2.5"/>
  </g>

  <!-- street -->
  <path d="M0 770 H1600 V1200 H0 Z" fill="url(#road)"/>
  <path d="M520 770 L360 1200 H1240 L1080 770 Z" fill="#5B625D"/>
  <path d="M520 770 L360 1200 H1240 L1080 770 Z" fill="url(#shadow)"/>
  <g stroke="#F4F1EA" stroke-width="6" stroke-dasharray="60 46" opacity="0.55">
    <path d="M800 800 V1200"/>
  </g>

  <!-- pavement -->
  <path d="M0 770 H520 L360 1200 H0 Z" fill="#DCD5C5"/>
  <path d="M1080 770 H1600 V1200 H1240 Z" fill="#DCD5C5"/>
  <g stroke="#B7AE9D" stroke-width="2" opacity="0.7">
    <path d="M0 850 H560 M0 950 H500 M0 1060 H440 M0 1160 H380"/>
    <path d="M1040 850 H1600 M1100 950 H1600 M1170 1060 H1600 M1230 1160 H1600"/>
    <path d="M170 770 L80 1200 M330 770 L250 1200 M1360 770 L1450 1200 M1510 770 L1580 1200"/>
  </g>

  <!-- motorbike silhouette parked -->
  <g fill="#101B17" opacity="0.8">
    <circle cx="700" cy="1000" r="34"/>
    <circle cx="870" cy="1000" r="34"/>
    <circle cx="700" cy="1000" r="20" fill="#5B625D"/>
    <circle cx="870" cy="1000" r="20" fill="#5B625D"/>
    <path d="M700 1000 L760 940 H840 L870 1000 L820 966 H756 Z"/>
    <path d="M820 940 H860 L876 972"/>
    <path d="M760 940 L730 900 H690"/>
    <rect x="676" y="888" width="26" height="12" rx="6"/>
  </g>

  <!-- shadows across street -->
  <path d="M0 1200 L0 980 L520 770 L560 820 L120 1200 Z" fill="#101B17" opacity="0.10"/>
  <path d="M1600 1200 L1600 980 L1080 770 L1040 820 L1480 1200 Z" fill="#101B17" opacity="0.10"/>

  <!-- caption plate -->
  <line x1="70" y1="1080" x2="1530" y2="1080" stroke="#F4F1EA" stroke-width="1" opacity="0.35"/>
  <g font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#F4F1EA" opacity="0.8">
    <text x="70" y="1118">KAWASAN KERJA / 04</text>
    <text x="1530" y="1118" text-anchor="end">JAKARTA — DEPOK — TANGERANG SELATAN</text>
  </g>
</svg>
